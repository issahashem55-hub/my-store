<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>متجر أبو الأكبر الجيسي</title>
<meta name="description" content="تطبيقات حصرية من تطويري">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --bg-2:#06060b;
    --text:#fbfaff;
    --text-2:#a8a5c0;
    --text-3:#5c5972;
    --gold:#ffcb6b;
    --gold-dark:#ffb037;
    --purple:#9d7bff;
    --pink:#ff6fa8;
    --teal:#5ee8de;
    --glass:rgba(255,255,255,.05);
    --glass-2:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.12);
    --radius-l:26px;
    --radius-m:18px;
    --radius-s:14px;
    --ease:cubic-bezier(.2,.9,.2,1);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Cairo",system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input{font-family:inherit;}
  ::selection{background:var(--gold); color:#1a1200;}

  .num{font-family:"Manrope","Cairo",sans-serif;}

  /* ---------- aurora + noise backdrop ---------- */
  .aurora{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .aurora span{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:.28;
    animation:drift 22s ease-in-out infinite;
  }
  .aurora span:nth-child(1){width:480px; height:480px; background:var(--gold); top:-160px; right:-100px; animation-delay:0s;}
  .aurora span:nth-child(2){width:420px; height:420px; background:var(--purple); bottom:-140px; left:-120px; animation-delay:-7s;}
  .aurora span:nth-child(3){width:360px; height:360px; background:var(--pink); top:40%; left:30%; animation-delay:-14s;}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(30px,-40px) scale(1.08);}
    66%{transform:translate(-25px,25px) scale(.95);}
  }
  .noise{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .app-shell{position:relative; z-index:2; max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  @media (min-width:860px){ .app-shell{max-width:900px;} }

  /* ---------- status bar ---------- */
  .status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 22px 4px; font-family:"Manrope",sans-serif; font-size:13px; font-weight:700; color:var(--text-2);
  }
  .status-bar .icons{display:flex; align-items:center; gap:6px;}

  /* ---------- header ---------- */
  .store-header{padding:18px 22px 14px; display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .header-titles{display:flex; flex-direction:column; gap:6px;}
  .eyebrow{font-size:12px; letter-spacing:.04em; color:var(--text-3); font-family:"Manrope",sans-serif; font-weight:700;}
  .store-title{
    font-size:26px; font-weight:900; line-height:1.15;
    background:linear-gradient(90deg,var(--gold),var(--gold-dark) 60%,var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-mark{
    position:relative; width:52px; height:52px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 30% 25%,#fff6da,var(--gold) 45%,var(--gold-dark) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(255,176,55,.35), inset 0 0 0 1px rgba(255,255,255,.4);
    overflow:hidden;
  }
  .brand-mark span{font-size:22px; font-weight:900; color:#241705;}
  .brand-mark::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);
    transform:translateX(-120%);
    animation:sweep 4s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,60%{transform:translateX(-120%);}
    100%{transform:translateX(120%);}
  }

  /* ---------- search ---------- */
  .search-wrap{padding:0 22px 14px;}
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:12px 16px; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    transition:border-color .25s var(--ease), background .25s var(--ease);
  }
  .search-box:focus-within{border-color:rgba(255,203,107,.5); background:var(--glass-2);}
  .search-box svg{flex:none; opacity:.6;}
  .search-box input{
    flex:1; background:none; border:none; color:var(--text); font-size:15px; outline:none;
  }
  .search-box input::placeholder{color:var(--text-3);}

  /* ---------- categories ---------- */
  .cats{
    display:flex; gap:10px; padding:0 22px 18px; overflow-x:auto; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:none; padding:9px 18px; border-radius:999px; font-size:13.5px; font-weight:700;
    background:var(--glass); border:1px solid var(--border); color:var(--text-2);
    transition:transform .2s var(--ease), background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
  }
  .cat-pill:active{transform:scale(.96);}
  .cat-pill.active{
    background:linear-gradient(90deg,var(--gold),var(--gold-dark));
    color:#241705; border-color:transparent;
  }

  /* ---------- grid ---------- */
  .grid-section{padding:4px 22px 32px; flex:1;}
  .app-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  @media (min-width:600px){ .app-grid{grid-template-columns:repeat(3,1fr);} }

  .app-card{
    background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:16px 14px; text-align:right; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    transition:transform .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
    display:flex; flex-direction:column; gap:10px;
  }
  .app-card:hover{transform:translateY(-4px); background:var(--glass-2); box-shadow:0 14px 30px rgba(0,0,0,.35);}
  .app-card:active{transform:scale(.97);}

  .app-icon{
    width:58px; height:58px; border-radius:16px; overflow:hidden; flex:none;
    background:linear-gradient(135deg,var(--gold),var(--purple));
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:800; color:#1a1200;
  }
  .app-icon img{width:100%; height:100%; object-fit:cover;}

  .app-card .name{font-size:15px; font-weight:800; line-height:1.3;}
  .app-meta{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2); font-family:"Manrope",sans-serif; font-weight:700;}
  .rating{color:var(--gold); display:flex; align-items:center; gap:3px;}
  .size-badge{
    background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:8px;
    padding:2px 8px; color:var(--text-3);
  }

  .empty-state{
    grid-column:1/-1; text-align:center; padding:48px 20px; color:var(--text-3); font-size:14px;
  }

  .store-footer{
    text-align:center; padding:18px 20px 110px; color:var(--text-3); font-size:12.5px;
    font-family:"Manrope",sans-serif; font-weight:600;
  }

  /* ---------- floating audio button ---------- */
  .audio-fab{
    position:fixed; bottom:26px; left:22px; z-index:50;
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    display:flex; align-items:center; justify-content:center; font-size:20px;
    box-shadow:0 10px 26px rgba(157,123,255,.4);
    transition:transform .2s var(--ease);
  }
  .audio-fab:active{transform:scale(.9);}
  .audio-fab.playing{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 10px 26px rgba(157,123,255,.4);}
    50%{box-shadow:0 10px 40px rgba(255,111,168,.55);}
  }

  /* ---------- screens ---------- */
  .screen{display:none; animation:fadeIn .35s var(--ease);}
  .screen.active{display:block;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- detail screen ---------- */
  .detail-topbar{padding:16px 22px 6px;}
  .back-btn{
    display:inline-flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700; color:var(--text-2);
    background:var(--glass); border:1px solid var(--border); padding:9px 16px; border-radius:999px;
    transition:background .2s var(--ease), transform .2s var(--ease);
  }
  .back-btn:active{transform:scale(.96);}
  .back-btn:hover{background:var(--glass-2); color:var(--text);}

  .detail-hero{padding:22px 22px 8px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;}
  .detail-icon{
    width:120px; height:120px; border-radius:30px; overflow:hidden; flex:none;
    background:linear-gradient(135deg,var(--gold),var(--purple));
    display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:800; color:#1a1200;
    box-shadow:0 24px 50px rgba(0,0,0,.5);
  }
  .detail-icon img{width:100%; height:100%; object-fit:cover;}
  .detail-name{font-size:24px; font-weight:900; line-height:1.25;}
  .cat-tag{
    font-size:12.5px; font-weight:700; padding:6px 16px; border-radius:999px;
    background:rgba(157,123,255,.15); color:var(--purple); border:1px solid rgba(157,123,255,.35);
  }

  .stat-row{display:flex; gap:10px; padding:20px 22px;}
  .stat-box{
    flex:1; background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:14px 8px; text-align:center; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .stat-box .v{font-size:17px; font-weight:800; font-family:"Manrope",sans-serif;}
  .stat-box .l{font-size:11.5px; color:var(--text-3); margin-top:4px;}

  .detail-section{padding:6px 22px 22px;}
  .detail-section h2{font-size:16.5px; font-weight:800; margin-bottom:12px;}
  .desc-text{font-size:14.5px; line-height:1.85; color:var(--text-2);}

  .shots-track{
    display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:none;
  }
  .shots-track::-webkit-scrollbar{display:none;}
  .shot{
    flex:none; width:150px; height:280px; border-radius:20px; scroll-snap-align:start;
    background:var(--glass); border:1px solid var(--border); overflow:hidden;
    display:flex; align-items:center; justify-content:center; color:var(--text-3); font-size:12px;
  }
  .shot img{width:100%; height:100%; object-fit:cover;}

  .feature-list{display:flex; flex-direction:column; gap:10px;}
  .feature-item{display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--text-2);}
  .feature-item .check{
    flex:none; width:22px; height:22px; border-radius:50%; background:rgba(255,203,107,.15);
    color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
  }

  .download-cta-wrap{padding:8px 22px 40px;}
  .btn-gold{
    width:100%; padding:17px; border-radius:var(--radius-s); font-size:16px; font-weight:800; color:#241705;
    background:linear-gradient(90deg,var(--gold),var(--gold-dark));
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
    box-shadow:0 14px 32px rgba(255,176,55,.28);
  }
  .btn-gold::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
    transform:translateX(-130%); animation:sweep 4s ease-in-out infinite;
  }
  .btn-gold:active{transform:scale(.96);}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    padding:22px; animation:fadeIn .3s var(--ease);
  }
  .modal-overlay.active{display:flex;}
  .modal-box{
    width:100%; max-width:360px; background:rgba(12,10,20,.85); border:1px solid var(--border);
    border-radius:var(--radius-l); padding:34px 26px 28px; text-align:center;
    backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .modal-box h3{font-size:17px; font-weight:800; margin-bottom:22px;}

  .countdown-wrap{position:relative; width:150px; height:150px; margin:0 auto 20px;}
  .countdown-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .countdown-wrap circle{fill:none; stroke-width:8; stroke-linecap:round;}
  .ring-bg{stroke:rgba(255,255,255,.08);}
  .ring-fill{
    stroke:url(#ringGradient);
    stroke-dasharray:408; stroke-dashoffset:408;
    transition:stroke-dashoffset 1s linear;
  }
  .countdown-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:40px; font-weight:800; font-family:"Manrope",sans-serif;
  }
  .countdown-msg{font-size:13.5px; color:var(--text-2); min-height:20px; margin-bottom:6px;}

  .ready-block{display:none; flex-direction:column; gap:12px;}
  .ready-block.show{display:flex; animation:slideUp .4s var(--ease);}
  @keyframes slideUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  .ready-title{font-size:16px; font-weight:800; color:var(--teal); margin-bottom:4px;}
  .link-btn{
    width:100%; padding:15px; border-radius:var(--radius-s); font-size:14.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .2s var(--ease);
  }
  .link-btn:active{transform:scale(.96);}
  .link-primary{background:linear-gradient(90deg,var(--gold),var(--gold-dark)); color:#241705;}
  .link-secondary{background:var(--glass-2); border:1px solid var(--border); color:var(--text);}
  .close-modal{
    margin-top:18px; font-size:13px; color:var(--text-3); font-weight:700;
  }

  /* reduced motion */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
    html{scroll-behavior:auto;}
  }

  :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px;}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="noise" aria-hidden="true"></div>

<div class="app-shell">

  <div class="status-bar" aria-hidden="true">
    <span class="num" id="clock">9:41</span>
    <span class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5L1 4.2C4 1.3 12 1.3 15 4.2L8 10.5Z" fill="currentColor" opacity=".9"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x=".5" y=".5" width="19" height="10" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="15" height="7" rx="1.2" fill="currentColor"/><rect x="20.5" y="3.5" width="1.5" height="4" rx="0.7" fill="currentColor"/></svg>
    </span>
  </div>

  <!-- ============ SCREEN 1: MAIN STORE ============ -->
  <main class="screen active" id="screen-main">
    <header class="store-header">
      <div class="header-titles">
        <span class="eyebrow">DIGITAL STORE • ANDROID APPS</span>
        <h1 class="store-title" id="storeTitle">متجر أبو الأكبر الجيسي</h1>
      </div>
      <div class="brand-mark" aria-hidden="true"><span>أ</span></div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="ابحث عن تطبيق..." aria-label="بحث في التطبيقات">
      </div>
    </div>

    <nav class="cats" id="catsBar" aria-label="تصفية حسب القسم"></nav>

    <section class="grid-section" aria-label="قائمة التطبيقات">
      <div class="app-grid" id="appGrid"></div>
    </section>

    <footer class="store-footer">صُمم بواسطة أبو الأكبر الجيسي • 5.11</footer>
  </main>

  <!-- ============ SCREEN 2: APP DETAIL ============ -->
  <section class="screen" id="screen-detail" aria-label="تفاصيل التطبيق">
    <div class="detail-topbar">
      <button class="back-btn" id="backBtn" aria-label="رجوع للمتجر">
        <span aria-hidden="true">→</span> رجوع للمتجر
      </button>
    </div>

    <div class="detail-hero">
      <div class="detail-icon" id="detailIcon"></div>
      <h2 class="detail-name" id="detailName"></h2>
      <span class="cat-tag" id="detailCat"></span>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="v"><span id="detailRating"></span> ⭐</div><div class="l">التقييم</div></div>
      <div class="stat-box"><div class="v" id="detailSize"></div><div class="l">الحجم</div></div>
      <div class="stat-box"><div class="v" id="detailVersion"></div><div class="l">الإصدار</div></div>
    </div>

    <div class="detail-section">
      <h2>📝 الوصف</h2>
      <p class="desc-text" id="detailDesc"></p>
    </div>

    <div class="detail-section" id="shotsSection">
      <h2>📸 لقطات الشاشة</h2>
      <div class="shots-track" id="shotsTrack"></div>
    </div>

    <div class="detail-section">
      <h2>✨ الميزات</h2>
      <div class="feature-list" id="featureList"></div>
    </div>

    <div class="download-cta-wrap">
      <button class="btn-gold" id="downloadBtn">⬇️ تحميل التطبيق</button>
    </div>
  </section>

</div>

<!-- ============ floating audio button ============ -->
<button class="audio-fab" id="audioFab" aria-label="تشغيل الموسيقى" aria-pressed="false">🎵</button>
<audio id="bgAudio" src="hashem.mp3" preload="none" loop></audio>

<!-- ============ SCREEN 3: DOWNLOAD MODAL ============ -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="نافذة التحميل">
  <div class="modal-box">
    <h3>جارٍ تجهيز التحميل</h3>

    <div class="countdown-wrap" id="countdownWrap">
      <svg viewBox="0 0 150 150" aria-hidden="true">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffcb6b"/>
            <stop offset="55%" stop-color="#ff6fa8"/>
            <stop offset="100%" stop-color="#9d7bff"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="75" cy="75" r="65"></circle>
        <circle class="ring-fill" id="ringFill" cx="75" cy="75" r="65"></circle>
      </svg>
      <div class="countdown-num num" id="countdownNum">10</div>
    </div>
    <p class="countdown-msg" id="countdownMsg">يتم التأكد من الملف...</p>

    <div class="ready-block" id="readyBlock">
      <div class="ready-title">✅ الرابط جاهز!</div>
      <a class="link-btn link-primary" id="mediafireLink" href="#" target="_blank" rel="noopener">⬇️ تحميل من MediaFire</a>
      <a class="link-btn link-secondary" id="megaLink" href="#" target="_blank" rel="noopener" style="display:none;">⬇️ تحميل من Mega</a>
    </div>

    <button class="close-modal" id="closeModalBtn">إغلاق</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var state = { store: null, apps: [], filtered: [], activeCat: "الكل", query: "", currentApp: null };

  var el = {
    grid: document.getElementById("appGrid"),
    cats: document.getElementById("catsBar"),
    search: document.getElementById("searchInput"),
    storeTitle: document.getElementById("storeTitle"),
    screenMain: document.getElementById("screen-main"),
    screenDetail: document.getElementById("screen-detail"),
    backBtn: document.getElementById("backBtn"),
    downloadBtn: document.getElementById("downloadBtn"),
    modal: document.getElementById("modalOverlay"),
    closeModalBtn: document.getElementById("closeModalBtn"),
    ringFill: document.getElementById("ringFill"),
    countdownNum: document.getElementById("countdownNum"),
    countdownMsg: document.getElementById("countdownMsg"),
    countdownWrap: document.getElementById("countdownWrap"),
    readyBlock: document.getElementById("readyBlock"),
    mediafireLink: document.getElementById("mediafireLink"),
    megaLink: document.getElementById("megaLink"),
    audioFab: document.getElementById("audioFab"),
    bgAudio: document.getElementById("bgAudio")
  };

  var RING_CIRC = 2 * Math.PI * 65;
  el.ringFill.style.strokeDasharray = RING_CIRC;
  el.ringFill.style.strokeDashoffset = RING_CIRC;

  var countdownMessages = [
    "يتم التأكد من الملف...",
    "جارٍ التحضير...",
    "يتم تجهيز الرابط...",
    "لحظات قليلة...",
    "على وشك الانتهاء..."
  ];
  var countdownTimer = null;
  var countdownMsgTimer = null;

  /* ---------- load data ---------- */
  fetch("apps.json")
    .then(function(r){ return r.json(); })
    .then(function(data){
      state.store = data;
      state.apps = data.apps || [];
      state.filtered = state.apps.slice();
      if(data.storeName){ el.storeTitle.textContent = data.storeName; }
      buildCats();
      renderGrid();
    })
    .catch(function(){
      el.grid.innerHTML = '<div class="empty-state">تعذّر تحميل بيانات التطبيقات (apps.json). تأكد من رفع الملف بجانب index.html.</div>';
    });

  function buildCats(){
    var cats = ["الكل"];
    state.apps.forEach(function(a){
      if(a.category && cats.indexOf(a.category) === -1){ cats.push(a.category); }
    });
    el.cats.innerHTML = "";
    cats.forEach(function(c){
      var btn = document.createElement("button");
      btn.className = "cat-pill" + (c === state.activeCat ? " active" : "");
      btn.textContent = c;
      btn.setAttribute("type", "button");
      btn.addEventListener("click", function(){
        state.activeCat = c;
        Array.prototype.forEach.call(el.cats.children, function(child){ child.classList.remove("active"); });
        btn.classList.add("active");
        applyFilters();
      });
      el.cats.appendChild(btn);
    });
  }

  function applyFilters(){
    var q = state.query.trim().toLowerCase();
    state.filtered = state.apps.filter(function(a){
      var matchesCat = state.activeCat === "الكل" || a.category === state.activeCat;
      var matchesQuery = !q || (a.name && a.name.toLowerCase().indexOf(q) !== -1);
      return matchesCat && matchesQuery;
    });
    renderGrid();
  }

  el.search.addEventListener("input", function(e){
    state.query = e.target.value;
    applyFilters();
  });

  function renderGrid(){
    el.grid.innerHTML = "";
    if(state.filtered.length === 0){
      el.grid.innerHTML = '<div class="empty-state">لا توجد تطبيقات مطابقة لبحثك.</div>';
      return;
    }
    state.filtered.forEach(function(app){
      var card = document.createElement("button");
      card.type = "button";
      card.className = "app-card";
      card.setAttribute("aria-label", "فتح صفحة " + (app.name || "التطبيق"));

      var iconHtml = app.icon
        ? '<img src="' + escapeAttr(app.icon) + '" alt="" loading="lazy" onerror="this.parentNode.textContent=\'' + firstLetter(app.name) + '\';this.parentNode.onerror=null;">'
        : firstLetter(app.name);

      card.innerHTML =
        '<div class="app-icon">' + iconHtml + '</div>' +
        '<div class="name">' + escapeHtml(app.name || "") + '</div>' +
        '<div class="app-meta">' +
          '<span class="rating">⭐ ' + (app.rating != null ? app.rating : "-") + '</span>' +
          '<span class="size-badge">' + escapeHtml(app.size || "") + '</span>' +
        '</div>';

      card.addEventListener("click", function(){ openDetail(app); });
      el.grid.appendChild(card);
    });
  }

  function firstLetter(name){
    return name && name.length ? name.trim().charAt(0) : "؟";
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c];
    });
  }
  function escapeAttr(str){ return escapeHtml(str); }

  /* ---------- detail screen ---------- */
  function openDetail(app){
    state.currentApp = app;

    var iconEl = document.getElementById("detailIcon");
    iconEl.innerHTML = app.icon
      ? '<img src="' + escapeAttr(app.icon) + '" alt="" onerror="this.parentNode.textContent=\'' + firstLetter(app.name) + '\';this.parentNode.onerror=null;">'
      : firstLetter(app.name);

    document.getElementById("detailName").textContent = app.name || "";
    document.getElementById("detailCat").textContent = app.category || "";
    document.getElementById("detailRating").textContent = app.rating != null ? app.rating : "-";
    document.getElementById("detailSize").textContent = app.size || "-";
    document.getElementById("detailVersion").textContent = app.version || "-";
    document.getElementById("detailDesc").textContent = app.description || "";

    var shotsTrack = document.getElementById("shotsTrack");
    var shotsSection = document.getElementById("shotsSection");
    shotsTrack.innerHTML = "";
    if(app.screenshots && app.screenshots.length){
      shotsSection.style.display = "";
      app.screenshots.forEach(function(src){
        var shot = document.createElement("div");
        shot.className = "shot";
        shot.innerHTML = '<img src="' + escapeAttr(src) + '" alt="" loading="lazy" onerror="this.parentNode.textContent=\'لا توجد صورة\';this.parentNode.onerror=null;">';
        shotsTrack.appendChild(shot);
      });
    } else {
      shotsSection.style.display = "none";
    }

    var featureList = document.getElementById("featureList");
    featureList.innerHTML = "";
    (app.features || []).forEach(function(f){
      var item = document.createElement("div");
      item.className = "feature-item";
      item.innerHTML = '<span class="check">✓</span><span>' + escapeHtml(f) + '</span>';
      featureList.appendChild(item);
    });

    showScreen("detail");
    window.scrollTo(0,0);
  }

  function showScreen(name){
    el.screenMain.classList.toggle("active", name === "main");
    el.screenDetail.classList.toggle("active", name === "detail");
  }

  el.backBtn.addEventListener("click", function(){
    showScreen("main");
    closeModal();
  });

  /* ---------- download modal / countdown ---------- */
  el.downloadBtn.addEventListener("click", function(){
    openModal();
  });

  function openModal(){
    el.modal.classList.add("active");
    el.readyBlock.classList.remove("show");
    el.countdownWrap.style.display = "";
    el.countdownMsg.style.display = "";
    startCountdown();
  }

  function closeModal(){
    el.modal.classList.remove("active");
    clearInterval(countdownTimer);
    clearInterval(countdownMsgTimer);
  }

  el.closeModalBtn.addEventListener("click", closeModal);
  el.modal.addEventListener("click", function(e){
    if(e.target === el.modal){ closeModal(); }
  });

  function startCountdown(){
    var total = 10;
    var current = total;
    el.countdownNum.textContent = current;
    el.ringFill.style.strokeDashoffset = RING_CIRC;

    var msgIndex = 0;
    el.countdownMsg.textContent = countdownMessages[0];

    clearInterval(countdownTimer);
    clearInterval(countdownMsgTimer);

    countdownTimer = setInterval(function(){
      current -= 1;
      if(current < 0){
        clearInterval(countdownTimer);
        clearInterval(countdownMsgTimer);
        showReady();
        return;
      }
      el.countdownNum.textContent = current;
      var progress = (total - current) / total;
      el.ringFill.style.strokeDashoffset = RING_CIRC * (1 - progress);
    }, 1000);

    countdownMsgTimer = setInterval(function(){
      msgIndex = (msgIndex + 1) % countdownMessages.length;
      el.countdownMsg.textContent = countdownMessages[msgIndex];
    }, 2000);
  }

  function showReady(){
    el.countdownWrap.style.display = "none";
    el.countdownMsg.style.display = "none";

    var app = state.currentApp || {};
    if(app.mediafire){
      el.mediafireLink.href = app.mediafire;
      el.mediafireLink.style.display = "";
    } else {
      el.mediafireLink.href = "#";
      el.mediafireLink.style.display = "";
    }
    if(app.mega){
      el.megaLink.href = app.mega;
      el.megaLink.style.display = "";
    } else {
      el.megaLink.style.display = "none";
    }

    el.readyBlock.classList.add("show");
  }

  /* ---------- floating audio ---------- */
  var isPlaying = false;
  el.audioFab.addEventListener("click", function(){
    if(isPlaying){
      el.bgAudio.pause();
      el.audioFab.textContent = "🎵";
      el.audioFab.classList.remove("playing");
      el.audioFab.setAttribute("aria-pressed", "false");
      el.audioFab.setAttribute("aria-label", "تشغيل الموسيقى");
    } else {
      el.bgAudio.play().catch(function(){ /* file may be missing until added */ });
      el.audioFab.textContent = "⏸️";
      el.audioFab.classList.add("playing");
      el.audioFab.setAttribute("aria-pressed", "true");
      el.audioFab.setAttribute("aria-label", "إيقاف الموسيقى");
    }
    isPlaying = !isPlaying;
  });

  /* ---------- status bar clock ---------- */
  function updateClock(){
    var el2 = document.getElementById("clock");
    var d = new Date();
    var h = d.getHours(); var m = d.getMinutes();
    var h12 = h % 12; if(h12 === 0){ h12 = 12; }
    el2.textContent = h12 + ":" + (m < 10 ? "0" + m : m);
  }
  updateClock();
  setInterval(updateClock, 30000);

})();
</script>
</body>
</html>
